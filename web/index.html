<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StampCleaner — PNG</title><link rel="stylesheet" href="style.css"></head><body><main><h1>StampCleaner</h1><p>Удаление фона печатей и подписей · прозрачный PNG</p><section><h2>1. Выберите фото</h2><input id="file" type="file" accept="image/*"></section><section><h2>2. Настройки</h2><label>Чувствительность <b id="v">38</b></label><input id="tol" type="range" min="10" max="110" value="38"><label>Цвет чернил</label><select id="ink"><option value="original">Оригинал</option><option value="#1441be">Синий</option><option value="#000000">Чёрный</option><option value="#7023a0">Фиолетовый</option><option value="#be2323">Красный</option><option value="#147841">Зелёный</option></select><button id="go" disabled>Удалить фон</button></section><section><h2>3. Результат</h2><canvas id="canvas"></canvas><button id="save" disabled>Скачать PNG</button><p id="status">Изображение обрабатывается в браузере и не отправляется на сервер.</p></section></main><script src="app.js"></script></body></html>
